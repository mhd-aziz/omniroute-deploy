name: Deploy OmniRoute

# MANUAL TRIGGER ONLY — sengaja tidak ada push/schedule/watcher.
# User men-trigger sendiri dari tab Actions saat mau update.
#
# Catatan keamanan: workflow_dispatch hanya bisa dipicu orang dengan akses write
# ke repo ini. Semua input tetap dialirkan lewat `env:` (bukan interpolasi
# langsung ke baris `run:`) dan bentuknya divalidasi di scripts/deploy.sh
# sebelum dipakai, jadi tidak ada jalur command injection dari input.
on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Tag image OmniRoute (diegosouzapw/omniroute:<tag>) atau sha256:<digest>. Default next-web. JANGAN pilih tag hanya karena namanya "latest" — cek freshness build dari registry dulu.'
        required: false
        default: 'next-web'
        type: string
      target:
        description: 'Target host untuk deploy'
        required: false
        default: 'akamai'
        type: choice
        options:
          - homelab
          - akamai
          - all
      cleanup:
        description: 'Mode pembersihan disk (full = recreate + hapus image lama supaya containerd GC membuang snapshot lama)'
        required: false
        default: 'normal'
        type: choice
        options:
          - normal
          - full
      verify_only:
        description: 'Hanya verifikasi (cek tag + laporan disk, tanpa pull/restart)'
        required: false
        default: false
        type: boolean
      allow_no_db_backup:
        description: 'Lanjutkan cleanup=full walau backup DB GAGAL (default: batalkan cleanup dan hidupkan container kembali)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  deploy-homelab:
    name: Deploy ke Homelab
    if: ${{ inputs.target == 'homelab' || inputs.target == 'all' }}
    runs-on: [self-hosted, Linux, X64, omniroute-homelab]
    # 35 menit: pull image next-web di homelab pernah 15m45s, dan cleanup=full
    # menambah backup DB volume (~50s untuk DB 176MB). 20 menit terlalu mepet.
    timeout-minutes: 35
    # Concurrency per HOST, bukan per nilai input: kalau di-key `inputs.target`,
    # run `all` dan run `homelab` masuk grup berbeda sehingga bisa mengantre
    # dua job untuk host yang sama.
    concurrency:
      group: omniroute-deploy-homelab
      cancel-in-progress: false
    env:
      COMPOSE_DIR: /home/bazyngan/omniroute
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Deploy OmniRoute (Homelab)
        shell: bash
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
          VERIFY_ONLY: ${{ inputs.verify_only }}
          CLEANUP: ${{ inputs.cleanup }}
          ALLOW_NO_DB_BACKUP: ${{ inputs.allow_no_db_backup }}
        run: |
          bash scripts/deploy.sh "$IMAGE_TAG" "$VERIFY_ONLY" "$CLEANUP"

  deploy-akamai:
    name: Deploy ke Akamai VM
    if: ${{ inputs.target == 'akamai' || inputs.target == 'all' }}
    runs-on: [self-hosted, Linux, X64, omniroute-akamai]
    timeout-minutes: 25
    concurrency:
      group: omniroute-deploy-akamai
      cancel-in-progress: false
    env:
      COMPOSE_DIR: /home/ubuntu/omniroute
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Deploy OmniRoute (Akamai)
        shell: bash
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
          VERIFY_ONLY: ${{ inputs.verify_only }}
          CLEANUP: ${{ inputs.cleanup }}
          ALLOW_NO_DB_BACKUP: ${{ inputs.allow_no_db_backup }}
        run: |
          bash scripts/deploy.sh "$IMAGE_TAG" "$VERIFY_ONLY" "$CLEANUP"

# Catatan:
# - cleanup=full akan ME-RESTART OmniRoute (stop -> backup DB -> rm container ->
#   up). Dipakai saat mau reklaim disk. Homelab melayani Hermes (omnilocal),
#   jadi pilih waktunya dengan sadar.
# - cleanup=normal (default) tidak me-restart container kalau image tidak berubah.
# - Script HANYA mengubah baris `image:` di docker-compose.yml. Blok environment,
#   volumes, command, ports TIDAK pernah disentuh.
# - Volume omniroute-data (DB) tidak pernah dihapus. Di mode full, DB di-backup
#   dulu ke <COMPOSE_DIR>/db-backup-<stamp>.tar.gz (retention 2 terbaru).
#   Kalau backup itu GAGAL, cleanup dibatalkan dan container dihidupkan kembali
#   (exit 1) — supaya tidak ada penghapusan tanpa jaring pengaman. Untuk memaksa
#   lanjut tanpa backup: set input allow_no_db_backup=true.
# - Log job memuat laporan disk SEBELUM/SESUDAH + jumlah containerd snapshot,
#   sehingga penumpukan layer lama langsung kelihatan.
